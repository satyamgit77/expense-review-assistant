services:
  - type: web
    name: expense-review-assistant
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-3.5-flash-lite
      - key: AI_CONFIDENCE_THRESHOLD
        value: "0.75"
      - key: AI_TIMEOUT_MS
        value: "30000"
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false